name: E2E Matrix Test

on: [push, pull_request]

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Skipped jobs show as Skipped in Actions.
    # macOS: Chrome Safe Storage / Keychain unavailable on runners.
    # Windows: Playwright Chromium hangs in CI (see tests/windows-e2e).
    if: matrix.os == 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
