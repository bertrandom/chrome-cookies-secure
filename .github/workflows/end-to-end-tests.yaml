name: E2E Matrix Test

on: [push, pull_request]

jobs:
  e2e:
    # Playwright install is slow on Windows; keep headroom beyond the test itself.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # macOS CI cannot use Chrome Safe Storage / Keychain reliably — run that path locally.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
